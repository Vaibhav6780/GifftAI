# ==============================================================
# Nginx config for GifftAI CRM — crm.gifftai.com
# Cloudflare Origin SSL + reverse proxy to Docker container
#
# HOW TO INSTALL ON THE SERVER:
#   sudo cp gifftai-crm.conf /etc/nginx/sites-available/gifftai-crm.conf
#   sudo ln -sf /etc/nginx/sites-available/gifftai-crm.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
#
# PREREQUISITES (one-time, on the server):
#   1. Cloudflare Origin cert for gifftai.com:
#        Cloudflare Dashboard → gifftai.com → SSL/TLS → Origin Server → Create Certificate
#        Add *.gifftai.com + gifftai.com → 15 years → download PEM + KEY
#        sudo mkdir -p /etc/ssl/cloudflare-gifftai
#        sudo cp origin.pem     /etc/ssl/cloudflare-gifftai/origin.pem
#        sudo cp origin-key.pem /etc/ssl/cloudflare-gifftai/origin-key.pem
#        sudo chmod 600 /etc/ssl/cloudflare-gifftai/origin-key.pem
#
#   2. DNS (Cloudflare Dashboard → gifftai.com → DNS):
#        Type  Name   Value          Proxy
#        A     crm    <SERVER_IP>    ✅ Proxied (orange cloud)
#
#   3. Cloudflare SSL/TLS mode → Full (strict)
#      (gifftai.com → SSL/TLS → Overview → Full (strict))
#
#   4. GifftAI CRM running on 127.0.0.1:3015 — see deploy steps below.
# ==============================================================

upstream gifftai_crm_frontend {
    server 127.0.0.1:3015;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name crm.gifftai.com;
    return 301 https://$host$request_uri;
}

# ==============================================================
# GifftAI CRM — crm.gifftai.com
#   The CRM's own nginx container serves the React SPA and
#   internally proxies /api and /socket.io to the Node API.
#   This block just forwards everything (incl. WS upgrade for
#   socket.io) to it — same pattern as crm.swisdex.com.
# ==============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.gifftai.com;

    # ── Cloudflare Origin SSL (gifftai.com cert) ──────────────
    ssl_certificate     /etc/ssl/cloudflare-gifftai/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-gifftai/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_GIFFTAI:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────
    # Re-uses the same snippet as swisdex.conf (already on the server).
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;

    # ── Client body size (for file uploads in CRM) ────────────
    client_max_body_size 15M;

    # ── Cloudflare real IP (same ranges as swisdex.conf) ──────
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Forward everything to the CRM container ───────────────
    # The container's internal nginx handles /api → Node API and
    # /socket.io → Node API proxying itself; this block just needs
    # to pass the raw request + WebSocket upgrade through.
    location / {
        limit_req zone=web_limit burst=40 nodelay;
        proxy_pass http://gifftai_crm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

